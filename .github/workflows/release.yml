name: Release AAB
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Add login deep link
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="com.linkblock.battle" android:host="auth"/></intent-filter>'
          i=s.index('</activity>')
          open(p,'w',encoding='utf-8').write(s[:i]+f+s[i:])
          PY
      - run: npx cap sync android
      - name: Apply app icon
        run: |
          RES=android/app/src/main/res
          find $RES -name 'ic_launcher*' -delete
          cp -r icons/* $RES/
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Set version and signing
        run: python3 scripts/patch_gradle.py
      - name: Build AAB
        env:
          KS_PATH: ${{ runner.temp }}/upload.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tetris-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
